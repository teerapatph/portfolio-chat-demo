<!doctype html>
<html lang="en">
	<head>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('app-theme') || 'red';
					document.documentElement.setAttribute('data-theme', t);
				} catch (_) {}
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AI Assistant Portfolio Demo</title>
		%sveltekit.head%
	</head>
	<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 overflow-hidden h-screen w-screen">
		<div id="svelte" class="h-full w-full">%sveltekit.body%</div>
	</body>
</html>
